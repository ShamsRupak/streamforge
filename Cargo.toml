[package]
name = "streamforge"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
memmap2 = "0.9"
crc32fast = "1.4"
lz4_flex = "0.11"
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "throughput"
harness = false
